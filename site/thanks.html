<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thanks · Alabama Events Map</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>:root{--bg:#efede8;--panel:#fff;--ink:#1c1e21;--muted:#686c73;--line:#e2dfd8;--accent:#a3263a;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1215;--panel:#171b20;--ink:#e8eaed;--muted:#959ca5;--line:#2a3038;--accent:#e8697c;--accent-ink:#1a0a0d;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:12vh auto 0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{font-size:30px;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}p{color:var(--muted);margin:0 0 20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}a{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:11px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
a.p{background:var(--accent);color:var(--accent-ink);border-color:transparent}</style></head>
<body><main><div class="card"><h1>Got it, thank you.</h1><p>We’ll review it and update the map, usually within a day. If we have a question, we’ll email you.</p>
<div class="btns"><a class="p" href="./">Back to the map</a><a href="submit.html">Submit another</a></div></div></main></body></html>
