<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Map · Side Mission</title>
<meta name="description" content="Yard sales, festivals, markets, trunk-or-treats and church events across Alabama, updated every week.">
<meta property="og:type" content="website">
<meta property="og:title" content="Side Mission · Alabama events map">
<meta property="og:description" content="Yard sales, festivals, markets and church events across Alabama, updated every week.">
<meta property="og:image" content="https://sidemissionmap.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1d3557">
<link rel="canonical" href="https://sidemissionmap.com/map">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Creepster&family=Fraunces:opsz,wght@9..144,600..800&family=Mountains+of+Christmas:wght@700&family=Josefin+Sans:wght@600;700&family=Shrikhand&display=swap">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/app.css">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="app">
  <div class="map-wrap">
    <div id="map" aria-label="Side Mission map of Alabama events"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="tools">
      <button type="button" class="tbtn" id="nearBtn" title="Show events near me"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg><span class="hide-sm">Near me</span></button>
      <button type="button" class="tbtn" id="stateBtn" title="Show all of Alabama"><svg viewBox="0 0 24 24"><path d="M9 3l6 2 6-2v16l-6 2-6-2-6 2V5zm1 2.3v12.5l4 1.3V6.6z"/></svg><span class="hide-sm">All Alabama</span></button>
      <div style="position:relative">
        <button type="button" class="tbtn" id="layerBtn" aria-haspopup="true" aria-expanded="false" title="Map type"><svg viewBox="0 0 24 24" id="layerIcon"></svg><span class="hide-sm" id="layerName">Map</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6z"/></svg></button>
        <div class="menu" id="layerMenu" role="menu" hidden></div>
      </div>
      <div style="position:relative">
        <button type="button" class="tbtn" id="themeBtn" aria-haspopup="true" aria-expanded="false"><span class="sw" id="themeSw"></span><span id="themeName">Theme</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6z"/></svg></button>
        <div class="menu" id="themeMenu" role="menu" hidden></div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <button type="button" class="grab" id="grab" aria-label="Show more events" aria-expanded="false"><span></span></button>
    <div class="p-head">
      <div>
        <div class="eyebrow"><span class="live"></span><span id="eyebrow">This week in Alabama</span></div>
        <h1 id="siteName" class="brand"><a href="./" title="Side Mission home"><svg class="mark" viewBox="0 0 80 80" aria-hidden="true"><path d="M12 70 C 44 72 50 54 32 48 C 14 42 20 31 58 32" fill="none" stroke="var(--brand-trail)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 8.5"/><circle cx="12" cy="70" r="5.5" fill="currentColor"/><path d="M58 32c0 0-13-12.5-13-20.5a13 13 0 0 1 26 0c0 8-13 20.5-13 20.5z" fill="currentColor"/><circle cx="58" cy="11.5" r="5" fill="var(--panel)"/></svg><span id="siteNameText">Side Mission</span></a></h1></h1>
      </div>
      <div class="stats">
        <div class="stat"><b id="sTotal">–</b><span>Upcoming</span></div>
        <div class="stat"><b id="sWeekend">–</b><span>This weekend</span></div>
        <div class="stat"><b id="sFree">–</b><span>Free</span></div>
      </div>
      <div class="top-actions">
        <a class="btn primary" href="submit.html"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Submit an event</a>
        <a class="btn" href="submit.html?type=featured">Get featured</a>
      </div>
    </div>
    <div class="p-controls">
      <label class="search" for="q"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input id="q" type="search" placeholder="Search events, towns, churches…" autocomplete="off"></label>
      <div class="seg" id="when" role="group" aria-label="When">
        <button type="button" id="w-weekend" data-w="weekend" aria-pressed="false">This weekend</button>
        <button type="button" id="w-week" data-w="week" aria-pressed="false">Next 7 days</button>
        <button type="button" id="w-all" data-w="all" aria-pressed="true">All upcoming</button>
      </div>
      <div class="chips" id="cats" role="group" aria-label="Categories"></div>
      <div id="sponsorSlot"></div>
    </div>
    <div class="p-list" id="list" aria-label="Event list"><p class="empty">Loading this week’s events…</p></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
<script src="assets/vendor/maplibre-gl.js"></script>
<script src="assets/basemap.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
